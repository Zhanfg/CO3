name: "Build Android APK"

on:
  push:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach the APK to'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Generate codegen artifacts
        run: |
          cd android
          ./gradlew generateCodegenArtifactsFromSchema

      - name: Build Release APK
        run: |
          cd android
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Fast branch build: arm64-v8a only"
            ./gradlew assembleRelease -PBUILD_ABI=arm64-v8a --build-cache --parallel
          else
            echo "Full build: all supported ABIs"
            ./gradlew assembleRelease --build-cache --parallel
          fi

      - name: Rename artifacts
        run: |
          APK_DIR=android/app/build/outputs/apk/release
          shopt -s nullglob
          APK_FILES=("$APK_DIR"/app-*-release.apk)
          if [ ${#APK_FILES[@]} -eq 0 ]; then
            echo "No release APKs found in $APK_DIR"
            exit 1
          fi
          for apk in "${APK_FILES[@]}"; do
            name=$(basename "$apk")
            abi=${name#app-}
            abi=${abi%-release.apk}
            mv "$apk" "CO3-Android-$abi.apk"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CO3-${{ github.sha }}
          path: CO3-Android-*.apk
          retention-days: 30

      - name: Attach APKs to GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: CO3-Android-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}