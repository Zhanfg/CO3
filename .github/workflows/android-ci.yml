name: Android CI

on:
  push:
    branches:
      - main
      - perf-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build arm64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Generate codegen
        working-directory: android
        run: ./gradlew generateCodegenArtifactsFromSchema --build-cache --parallel

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PBUILD_ABI=arm64-v8a --build-cache --parallel

      - name: Collect APK
        run: |
          APK=android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          test -f "$APK"
          cp "$APK" CO3-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CO3-arm64-${{ github.sha }}
          path: CO3-arm64.apk
          retention-days: 14
